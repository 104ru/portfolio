<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DH screens: HTML vs source</title>
<style>body{margin:0;font:13px -apple-system,sans-serif;background:#eee;padding:16px}.grid{display:flex;flex-wrap:wrap;gap:18px}.pair{background:#fff;padding:8px;border:1px solid #ddd}.pair h4{margin:0 0 6px;font-size:12px}.pair .two{display:flex;gap:6px}.pair img{width:192px;height:auto;display:block;border:1px solid #ccc}.pair iframe{width:375px;height:667px;border:1px solid #ccc;transform:scale(.512);transform-origin:top left;background:#fff}.pair .fr{width:192px;height:342px;overflow:hidden}.pair.missing .fr{display:grid;place-items:center;color:#999;background:#fafafa}</style></head>
<body><div class="grid" id="g"></div>
<script>
const ids=['home-00','password-00','password-01','password-02','password-03','password-04','password-05','peripheral-00','peripheral-01','peripheral-02','peripheral-03','peripheral-04','peripheral-05','peripheral-06','peripheral-07','issue-00','issue-01','issue-02','issue-03','issue-04','issue-05','refresh-00','refresh-01','refresh-02','refresh-03','refresh-04','refresh-05','refresh-06','refresh-07','refresh-08','refresh-09','refresh-10','rooms1-00','rooms1-01','rooms1-02','rooms1-03','rooms1-04','rooms2-00','rooms2-01','rooms2-02','rooms2-03','rooms3-00','rooms3-01','lost-00','lost-01','lost-02','lost-03','lost-04','lost-05','lost-06','lost-07','lost-08','lost-09','lost-10','lost-11','notify-00','lost-12','lost-13','lost-14','lost-15','articles-01','articles-00'];
const only=new URLSearchParams(location.search).get('only');
ids.filter(id=>!only||id.startsWith(only)).forEach(async id=>{const ok=(await fetch('../html/'+id+'.html',{method:'HEAD'})).ok;const d=document.createElement('div');d.className='pair'+(ok?'':' missing');d.innerHTML='<h4>'+id+'</h4><div class="two"><img src="../screens/'+id+'.webp" loading="lazy"><div class="fr">'+(ok?'<iframe src="../html/'+id+'.html" loading="lazy"></iframe>':'not built')+'</div></div>';document.getElementById('g').append(d);});
</script></body></html>
