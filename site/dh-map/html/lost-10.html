<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Almost there</title><link rel="stylesheet" href="../proto/dh.css?v=6"></head><body>
<header class="appbar plain" data-close></header>
<main class="content">
  <div style="height:90px"></div>
  <h2 class="h" style="text-align:center;font-weight:500;font-size:18px">Almost there!</h2>
  <div style="height:24px"></div>
  <div class="list" style="gap:22px;padding:0 10px">
    <div class="check" style="gap:18px"><span class="checkmark" style="width:30px;height:30px"></span><span>Please select the devices that were lost</span></div>
    <div class="check" style="gap:18px"><span class="checkmark" style="width:30px;height:30px"></span><span>Change your account password</span></div>
    <div class="check" style="gap:18px"><span class="checkmark" style="width:30px;height:30px"></span><span>Where and when have you seen your machine for the last time?</span></div>
    <div class="check" style="gap:18px"><span class="checkmark" style="width:30px;height:30px"></span><span>Fill the Security Forms</span></div>
    <div class="check" style="gap:18px;align-items:flex-start"><i class="warn" data-icon="warn" style="width:30px;height:30px"></i><span><b style="color:var(--red)">File the Police Report and Attach the Receipt</b><br><small class="caption" style="color:var(--ink)">You have two days to file the police report about your stolen device.</small></span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn primary">Create the lost laptop issue</button>
  <div style="height:40px"></div>
</main>
<script src="../proto/dh.js?v=3"></script></body></html>
