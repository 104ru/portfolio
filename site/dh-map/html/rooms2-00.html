<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Report an issue</title><link rel="stylesheet" href="../proto/dh.css?v=6">
<style>
.hero{height:200px;background:#e4e9ee;margin:14px 20px 0;padding:10px}
.loc{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 0}
.loc .txt{font-size:13px;color:var(--ink-2);line-height:1.4}
.loc .txt b{display:block;font-weight:700;color:var(--ink)}
.loc .acc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:6px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
.rname{font-size:19px;font-weight:700;padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.feat{display:grid;grid-template-columns:84px 1fr;gap:10px 8px;padding:14px 16px 0;font-size:17px;line-height:1.35}
.feat .k{font-size:13px;color:var(--muted);padding-top:3px}
.feat .v{color:var(--ink)}
</style></head><body>
<header class="appbar" data-title="My Meeting Rooms"></header>
<div class="banner-red">TV is not working in the Ormen Room</div>
<main class="content" style="padding:0;gap:0">

  <div class="rname" style="font-size:17px;padding-top:4px">Room Features</div>
  <div class="feat"><span class="k">Date</span><span class="v">May 3 2020</span><span class="k">Time</span><span class="v">9:00 - 9:30</span><span class="k">Capacity</span><span class="v">5 people</span><span class="k">Amenities</span><span class="v">Camera<br>Microphone<br>HDTV</span></div>
  <div class="spacer"></div>
  <div style="padding:16px"><button class="btn primary" style="min-height:48px">Find another room</button></div>
</main>
<nav class="bottomnav"></nav>
