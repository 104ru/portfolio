<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>Virtual Machine Ready</title><link rel="stylesheet" href="../proto/dh.css"></head><body>
<div class="screen">
  <div class="phone-bg"></div>
  <div class="toast" style="top:64px;padding:12px 14px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="width:30px;height:30px;border-radius:7px;background:#0f6cbd;color:#fff;display:grid;place-items:center;font:700 16px/1 Roboto,sans-serif">O</span><span style="font-size:10px;color:var(--hint)">now</span></div>
    <b>Your temporary virtual machine is ready</b>
    Dear Peter, we are very sorry to hear that your machine is lost. To get you up and running, we provided the virtual environment based on your machine backup.
  </div>
  <div class="ios-grid" style="bottom:118px">
    <span style="background:#f1f1f1"></span><span style="background:linear-gradient(180deg,#ffe066 0 28%,#fff 28%)"></span><span></span><span style="background:#e03131"></span>
    <span style="background:#d6336c"></span><span style="background:#228be6"></span><span style="background:#f76707"></span><span style="background:#212529"></span>
    <span style="background:linear-gradient(180deg,#fff 0 100%);box-shadow:0 2px 6px rgba(0,0,0,.25),inset 0 -18px 0 #ffa94d"></span><span></span><span style="background:#40c057"></span><span style="background:#343a40"></span>
    <span style="background:#4dabf7"></span><span style="background:#868e96"></span><span class="ey" style="position:relative">EY<i style="position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--red)"></i></span>
  </div>
  <div class="dots-row" style="position:absolute;left:0;right:0;bottom:96px;padding:0"><i style="background:rgba(255,255,255,.5)"></i><i style="background:#fff"></i><i style="background:rgba(255,255,255,.5)"></i></div>
  <div class="ios-dock"><span style="background:#40c057"></span><span style="background:#228be6"></span><span style="background:#51cf66"></span><span style="background:#fff"></span></div>
</div>
<script src="../proto/dh.js"></script></body></html>
