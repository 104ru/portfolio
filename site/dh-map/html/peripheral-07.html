<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><title>My EY</title><link rel="stylesheet" href="../proto/dh.css?v=6"></head><body>
<header class="appbar" data-title="My EY"></header>
<main class="content" style="background:var(--bg);padding:12px 12px 16px">
  <div class="card" style="padding:12px 10px 10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);letter-spacing:.4px"><span>MY EY</span><span style="font-size:10px;color:var(--hint)">now</span></div>
    <p style="font-size:14px;font-weight:700;margin-top:10px">Digital Locker Pickup Ready</p>
    <p class="lead" style="margin-top:8px">Your order number 15382790 is ready for the pickup at the vending machine at 69 Euston Rd, London NW1 2AE. Locker #33225.</p>
    <div style="display:flex;gap:8px;align-items:stretch;margin-top:10px">
      <div class="map pic img-map-london" style="flex:1;height:64px"><i class="pin" data-icon="pin" style="left:42%;top:70%"></i><span class="lbl">Wellcome Collection</span></div>
      <div style="width:64px;height:64px;border:1px solid var(--line);background:#f4f4f4;display:grid;place-items:center;color:var(--hint)"><i data-icon="down" style="width:30px;height:30px"></i></div>
    </div>
    <div class="actions" style="margin-top:10px;gap:6px">
      <button class="btn grey">Office map</button>
      <button class="btn outline">View key</button>
    </div>
  </div>
</main>
<nav class="bottomnav"><i data-icon="grid"></i><i data-icon="gauge"></i><i data-icon="face"></i><span class="home" style="position:relative"><i data-icon="bell"></i><i style="position:absolute;right:16px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--red)"></i></span><i data-icon="bookmark"></i></nav>
<script src="../proto/dh.js?v=3"></script></body></html>
