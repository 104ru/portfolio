<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkPromptu · The 360° world</title><link rel="stylesheet" href="pannellum.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#172d31;color:#fff;font:16px system-ui,sans-serif}body{display:flex;flex-direction:column}.tour-tools{display:flex;align-items:center;gap:16px;padding:8px 16px;min-height:60px;background:#fff;color:#223640}.tour-tools label{font-size:14px}.tour-tools select{font:inherit;min-height:44px;border:1px solid #bccbd0;background:#fff;color:#223640;padding:8px 34px 8px 12px;border-radius:4px;max-width:65vw}#panorama{flex:1;min-height:0}#status{font-size:13px;color:#5d6b72;margin-left:auto}.pnlm-title-box,.pnlm-author-box{display:none}select:focus-visible{outline:3px solid #2c6e7e;outline-offset:2px}@media(max-width:600px){#status{display:none}.tour-tools{gap:10px;padding:6px 12px}}</style><div class="tour-tools"><label for="scene">Explore</label><select id="scene"><option value="night">The desert town</option><option value="entry">The foyer</option><option value="apartment">Living quarters</option><option value="kitchen">The kitchen</option><option value="bar">Clockwork Caravanserai</option><option value="grocery">Mechaniker Grocery</option><option value="hotel">Motel-404</option><option value="window">The valley view</option></select><span id="status" role="status">Loading the world…</span></div><div id="panorama" aria-label="Interactive 360-degree panorama"></div><script src="pannellum.js"></script><script src="tour.js"></script></html>
<style>.pnlm-scene:focus-visible,.pnlm-zoom-in:focus-visible,.pnlm-zoom-out:focus-visible{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 6px #203e45}</style>
<style>.pnlm-zoom-controls{width:44px;height:88px}.pnlm-zoom-in,.pnlm-zoom-out{background-image:none;display:grid;place-items:center;font:22px/1 system-ui,sans-serif;color:#223640}.pnlm-zoom-in::after{content:'+'}.pnlm-zoom-out::after{content:'−'}.pnlm-scene::before{content:'';position:absolute;inset:-9px}</style>
